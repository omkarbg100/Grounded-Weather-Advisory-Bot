- id: GEN-FAVORABLE-OUTDOOR-01
  category: outdoor_exercise
  title: Favorable and Low Risk Outdoor Weather Conditions
  severity: info
  applies_to: ["cycling", "running", "walking", "cricket", "swimming", "sports", "picnic", "commute", "travel"]
  when:
    all:
      - fact: temp_c
        op: "<="
        value: 36.0
      - fact: temp_c
        op: ">="
        value: 15.0
      - fact: wind_kmh
        op: "<"
        value: 30.0
      - fact: precip_window_mm
        op: "<"
        value: 1.0
      - fact: has_thunderstorm
        op: "=="
        value: 0
  advice: >
    Weather conditions in {location} are favorable for outdoor activities with low weather risk (temperature {temp_c}°C, calm wind {wind_kmh} km/h, clear skies). Standard hydration and sun protection (UV index {uv_max}) apply. [GEN-FAVORABLE-OUTDOOR-01]
  tags: ["favorable", "safe", "clear", "cycling", "sports", "cricket", "swimming"]
