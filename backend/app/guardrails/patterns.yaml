# Input guardrail patterns.
#
# Loaded by app/guardrails/__init__.py. Regex syntax is Python `re`, flags are
# I (ignore case), M (multiline) or S (dot matches newline).

# Redactions applied to the user message before it ever reaches the model.
pii_patterns:
  - pattern: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'
    replacement: "[EMAIL_REDACTED]"
  - pattern: '\b(?:\+?\d{1,3}[-.\s]?)?\(?\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4}\b'
    replacement: "[PHONE_REDACTED]"
  # 10-digit national format, e.g. 98765 43210 or +919876543210.
  - pattern: '\b(?:\+\d{1,3}[-.\s]?)?\d{5}[-.\s]?\d{5}\b'
    replacement: "[PHONE_REDACTED]"
  - pattern: '\b\d{4}[-\s]?\d{4}[-\s]?\d{4}\b'
    replacement: "[SENSITIVE_ID_REDACTED]"

# A match sets injection_flag and short-circuits the agent.
injection_patterns:
  - pattern: 'ignore\s+(all\s+|any\s+)?(the\s+)?(previous\s+|prior\s+|above\s+|earlier\s+)?instructions'
    flags: I
  - pattern: 'disregard\s+(all\s+|any\s+)?(the\s+)?(previous\s+|prior\s+|above\s+|earlier\s+)?(instructions?|rules?|prompt)'
    flags: I
  - pattern: 'override\s+sops?'
    flags: I
  - pattern: 'you\s+are\s+now'
    flags: I
  - pattern: 'system\s+prompt'
    flags: I
  - pattern: 'developer\s+mode'
    flags: I
  - pattern: 'unfiltered\s+ai'
    flags: I
  - pattern: 'bypass\s+rules'
    flags: I
  - pattern: 'forget\s+(all\s+|any\s+)?(your\s+|the\s+)?(previous\s+|prior\s+)?instructions'
    flags: I
  - pattern: '<\s*\|?\s*im_start\s*\|?\s*>'
    flags: I

# Characters below 0x20 are stripped from user input, except these.
allowed_control_chars: ["\n", "\r", "\t"]

# Maximum characters of the user message kept after sanitisation.
max_message_chars: 500